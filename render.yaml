services:
  - type: web
    name: paperproof
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: JWT_SECRET
        generateValue: true
      - key: CONTACT_EMAIL
        value: team@paperproof.app
      - key: CORS_ORIGINS
        value: "*"
